name: Deploy Backend to Google Cloud Run (CI/CD)

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/deploy_backend.yml"
  workflow_dispatch:

concurrency:
  group: flews-backend-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGION: ${{ secrets.GCP_REGION || 'us-central1' }}
  SERVICE_NAME: flews-backend

jobs:
  test:
    name: Test Rails
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: backend_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d backend_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      RAILS_ENV: test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4.10"
          bundler-cache: true
          working-directory: backend

      - name: Prepare test database
        working-directory: backend
        run: bin/rails db:prepare

      - name: Run Rails tests
        working-directory: backend
        run: bin/rails test

  deploy:
    name: Build, migrate and deploy
    needs: test
    runs-on: ubuntu-latest
    environment: production

    env:
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required secrets
        shell: bash
        run: |
          if [[ -z "${GCP_SA_KEY}" ]]; then
            echo "::error::Missing required GitHub secret: GCP_SA_KEY"
            exit 1
          fi

      - name: Authenticate with Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Resolve Google Cloud project
        shell: bash
        env:
          AUTH_PROJECT_ID: ${{ steps.auth.outputs.project_id }}
        run: |
          if [[ -z "${AUTH_PROJECT_ID}" ]]; then
            echo "::error::The service account does not define a Google Cloud project."
            exit 1
          fi
          echo "PROJECT_ID=${AUTH_PROJECT_ID}" >> "${GITHUB_ENV}"

      - name: Recover the current private Cloud Run environment
        shell: bash
        run: |
          umask 077
          gcloud run services describe "${SERVICE_NAME}" \
            --project "${PROJECT_ID}" \
            --region "${REGION}" \
            --format=json > "${RUNNER_TEMP}/current-service.json"

          jq -e '
            (.spec.template.spec.containers[0].env // [])
            | map(select(has("value")) | { key: .name, value: .value })
            | from_entries
            | if ((.SECRET_KEY_BASE // "") | length) == 0 then
                error("SECRET_KEY_BASE is not available in the current Cloud Run service")
              elif ((.DATABASE_URL // "") | length) == 0 then
                error("DATABASE_URL is not available in the current Cloud Run service")
              else
                . + {
                  RAILS_ENV: "production",
                  RAILS_SERVE_STATIC_FILES: "true",
                  RAILS_LOG_TO_STDOUT: "true",
                  RAILS_MAX_THREADS: "5"
                }
              end
          ' "${RUNNER_TEMP}/current-service.json" > "${RUNNER_TEMP}/service-env.json"

          jq -e '{
            RAILS_ENV: "production",
            SECRET_KEY_BASE: .SECRET_KEY_BASE,
            DATABASE_URL: (.DATABASE_URL | sub(":6543/"; ":5432/")),
            RAILS_LOG_TO_STDOUT: "true"
          }' "${RUNNER_TEMP}/service-env.json" > "${RUNNER_TEMP}/migration-env.json"

          chmod 600 \
            "${RUNNER_TEMP}/current-service.json" \
            "${RUNNER_TEMP}/migration-env.json" \
            "${RUNNER_TEMP}/service-env.json"

      - name: Build and publish image
        working-directory: backend
        shell: bash
        run: |
          build_id="$(gcloud builds submit \
            --project "${PROJECT_ID}" \
            --tag "gcr.io/${PROJECT_ID}/${SERVICE_NAME}:${GITHUB_SHA}" \
            --tag "gcr.io/${PROJECT_ID}/${SERVICE_NAME}:latest" \
            --async \
            --format='value(id)' \
            .)"

          if [[ -z "${build_id}" ]]; then
            echo "::error::Cloud Build did not return a build identifier."
            exit 1
          fi

          deadline=$((SECONDS + 1200))
          while (( SECONDS < deadline )); do
            build_status="$(gcloud builds describe "${build_id}" \
              --project "${PROJECT_ID}" \
              --format='value(status)')"

            case "${build_status}" in
              SUCCESS)
                echo "Cloud Build completed successfully."
                break
                ;;
              FAILURE|INTERNAL_ERROR|TIMEOUT|CANCELLED|EXPIRED)
                echo "::error::Cloud Build finished with status ${build_status}."
                gcloud builds describe "${build_id}" \
                  --project "${PROJECT_ID}" \
                  --format='yaml(status,failureInfo)'
                exit 1
                ;;
              *)
                sleep 10
                ;;
            esac
          done

          if [[ "${build_status}" != "SUCCESS" ]]; then
            echo "::error::Cloud Build did not finish within 20 minutes."
            exit 1
          fi

      - name: Configure migration job
        run: |
          gcloud run jobs deploy "${SERVICE_NAME}-migrate" \
            --project "${PROJECT_ID}" \
            --image "gcr.io/${PROJECT_ID}/${SERVICE_NAME}:${GITHUB_SHA}" \
            --region "${REGION}" \
            --command bin/rails \
            --args db:migrate \
            --tasks 1 \
            --max-retries 0 \
            --task-timeout 10m \
            --env-vars-file="${RUNNER_TEMP}/migration-env.json" \
            --quiet

      - name: Run production migration
        run: |
          gcloud run jobs execute "${SERVICE_NAME}-migrate" \
            --project "${PROJECT_ID}" \
            --region "${REGION}" \
            --wait \
            --quiet

      - name: Deploy Cloud Run service
        run: |
          gcloud run deploy "${SERVICE_NAME}" \
            --project "${PROJECT_ID}" \
            --image "gcr.io/${PROJECT_ID}/${SERVICE_NAME}:${GITHUB_SHA}" \
            --region "${REGION}" \
            --allow-unauthenticated \
            --port 8080 \
            --memory 512Mi \
            --env-vars-file="${RUNNER_TEMP}/service-env.json" \
            --quiet

      - name: Verify production health
        shell: bash
        run: |
          service_url="$(gcloud run services describe "${SERVICE_NAME}" \
            --project "${PROJECT_ID}" \
            --region "${REGION}" \
            --format='value(status.url)')"
          curl --fail --silent --show-error \
            --retry 5 \
            --retry-delay 5 \
            "${service_url}/up"

      - name: Remove temporary environment files
        if: always()
        shell: bash
        run: |
          rm -f \
            "${RUNNER_TEMP}/current-service.json" \
            "${RUNNER_TEMP}/migration-env.json" \
            "${RUNNER_TEMP}/service-env.json"
