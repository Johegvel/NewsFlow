name: Deploy Backend to Google Cloud Run (CI/CD)

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy_backend.yml'

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID || 'flews-backend-prod' }}
  REGION: ${{ secrets.GCP_REGION || 'us-central1' }}
  SERVICE_NAME: flews-backend
  IMAGE_NAME: gcr.io/flews-backend-prod/flews-backend

jobs:
  deploy:
    name: Build & Deploy to Cloud Run
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: 🔐 Autenticación en Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: ⚙️ Configurar Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: 🐳 Compilar y subir imagen en Google Cloud Build
        run: |
          cd backend
          gcloud builds submit --tag ${{ env.IMAGE_NAME }}:${{ github.sha }} --tag ${{ env.IMAGE_NAME }}:latest .

      - name: 🚀 Desplegar contenedor en Google Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --allow-unauthenticated \
            --port 8080 \
            --memory 512Mi \
            --set-env-vars="RAILS_ENV=production,SECRET_KEY_BASE=${{ secrets.SECRET_KEY_BASE || '862442930a612064e7e7bee5304d6f071edfb0e7f8607d52aa36a6e2c03bcb3b1d1d7960d868ab831685612c75587f6cfcf235f9ef11bb73ac33f75d30e19a04' }},DATABASE_URL=${{ secrets.DATABASE_URL || 'postgresql://postgres.qumigrhryjxcypebnljc:af3%3D8%25fB%2A47gR3_@aws-0-us-west-2.pooler.supabase.com:6543/postgres?sslmode=require' }},RAILS_SERVE_STATIC_FILES=true,RAILS_LOG_TO_STDOUT=true,RAILS_MAX_THREADS=5"
